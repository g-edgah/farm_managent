[package]
name = "farm_managent"
version = "0.1.0"
authors = ["g-edgah <172597903+g-edgah@users.noreply.github.com>"]
edition = "2021"


[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1", features = ["derive"] }

# Server-only dependencies (optional)
sqlx = { version = "0.9", optional = true, default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    "macros",
    "chrono",
    "uuid",
] }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread"] }
dotenvy = { version = "0.15", optional = true }
dioxus-free-icons = { version = "0.10", features = ["font-awesome-brands", "font-awesome-regular"] }
argon2 = { version = "0.6.0", optional = true }

[features]
default = []

web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:sqlx", "dep:tokio", "dep:dotenvy", "dep:argon2"]
